# Quality gate G2: runs the full test suite on every pull request and every push to main.
# Make it required: repo Settings > Branches > main rule > "Require status checks to pass" > tests.
name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
